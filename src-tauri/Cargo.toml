[package]
name = "apex-telemetry"
version = "0.1.3"
edition = "2021"

[lib]
name = "apex_telemetry"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
url = "2"
llama-cpp-2 = { version = "=0.1.160", default-features = false }
libxrk = { git = "https://github.com/m3rlin45/libxrk", rev = "4e44d38debc9445b8e5446c9b7a241f5730ac920", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Foundation"] }
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Model integrity checks stream hundreds of MB even in development builds.
[profile.dev.package.sha2]
opt-level = 3
