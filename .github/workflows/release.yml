name: Release Ten Tenths Telemetry

on:
  push:
    branches:
      - main # Build-only validation; publisher requires a tag.
    tags:
      - 'v*'
  workflow_dispatch: # Build/test/artifacts only; never publishes a release.
    inputs:
      platforms:
        description: Native platforms to validate
        type: choice
        default: macos
        options: [macos, all]

# Tags default to macOS only. Set repository variable RELEASE_PLATFORMS=all
# when resuming cross-platform releases; dispatch can validate either mode.
env:
  RELEASE_PLATFORMS: ${{ inputs.platforms || vars.RELEASE_PLATFORMS || 'macos' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Apple Silicon build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # Published builds never reuse a cache.
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          key: macos-aarch64
      - name: Verify version and install dependencies
        run: |
          node scripts/verify-release-version.mjs
          npm ci
          npx playwright install chromium
      - name: Shared frontend and release-policy tests
        run: |
          npm test
          npm run test:release
      - name: Provision and verify self-contained YouTube helpers
        run: |
          npm run prepare:youtube
          npm run test:youtube-tools
      # Private ignored XRKs are deliberately not uploaded into CI.
      - name: Native Rust, persistence and real media tests
        run: |
          node scripts/verify-native-video-tests.mjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test persistence --test video --test video_analysis --test feature_parity
      - name: Browser workflows (simulated IPC, not native GUI acceptance)
        run: |
          npm run test:branding
          npm run test:sidebar
          npm run test:workflow
          npm run test:canvas
          npm run test:video
      - name: Build Apple Silicon app and DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          node scripts/prepare-coach-model.mjs --download
          npm run build:mac
      - name: Inspect and stage native artifacts
        run: node scripts/stage-release-artifacts.mjs macos "${{ runner.temp }}/ttt-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttt-macos
          path: ${{ runner.temp }}/ttt-release/macos/
          if-no-files-found: error
          compression-level: 0

  windows:
    if: (inputs.platforms || vars.RELEASE_PLATFORMS || 'macos') == 'all'
    name: Windows x64 MSVC build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # Published builds never reuse a cache.
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          key: windows-x64-msvc-v2
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: make diffutils pkgconf mingw-w64-ucrt-x86_64-gcc
      - name: Provision native Windows YouTube helpers
        shell: msys2 {0}
        run: |
          node scripts/prepare-youtube-tools.mjs --download
          node --test scripts/youtube-tool-tests.mjs
          node scripts/verify-youtube-tools.mjs
      - name: Verify version and install dependencies
        run: |
          node scripts/verify-release-version.mjs
          npm ci
          npx playwright install chromium
      - name: Shared frontend and release-policy tests
        run: |
          npm test
          npm run test:release
      - name: Native Windows compilation and real media tests
        run: |
          cargo check --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
          node scripts/verify-native-video-tests.mjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test persistence --test video --test video_analysis --test feature_parity
      - name: Browser workflows (simulated IPC, not native GUI acceptance)
        run: |
          npm run test:branding
          npm run test:sidebar
          npm run test:workflow
          npm run test:canvas
          npm run test:video
      - name: Build per-user Windows x64 NSIS installer
        run: |
          node scripts/prepare-coach-model.mjs --download
          npm run build:windows
      - name: Inspect x64 GUI executable, NSIS contents and notices
        run: node scripts/stage-release-artifacts.mjs windows "${{ runner.temp }}/ttt-release"
      - name: Hosted WebView2 runtime with disposable synthetic recordings
        run: node scripts/verify-windows-runtime.mjs
      - name: Smoke install, update and uninstall with disposable runner data
        run: pwsh -NoProfile -NonInteractive -File scripts/verify-windows-install.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ttt-windows
          path: ${{ runner.temp }}/ttt-release/windows/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified native release
    needs: [macos, windows]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.macos.result == 'success' &&
      (((inputs.platforms || vars.RELEASE_PLATFORMS || 'macos') == 'macos' && needs.windows.result == 'skipped') ||
       ((inputs.platforms || vars.RELEASE_PLATFORMS || 'macos') == 'all' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    environment: release # Add required reviewers to this environment in repository settings.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ttt-macos
          path: release-artifacts/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.RELEASE_PLATFORMS == 'all'
        with:
          name: ttt-windows
          path: release-artifacts/windows
      - name: Verify complete artifact set from this revision and run
        run: node scripts/verify-release-artifacts.mjs release-artifacts "${GITHUB_REF_NAME#v}"
      - name: Draft, upload, verify, then publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-youtube-redistribution.mjs
          node scripts/publish-release.mjs release-artifacts
